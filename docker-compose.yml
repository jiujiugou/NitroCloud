# NitroCloud 部署
#
# 一键启动：
#   docker compose up -d --build
#
# 停止：
#   docker compose down
#
# 清理数据：
#   docker compose down -v
#
# 用户访问：
#   Web: http://服务器IP:8088
#
# 管理端口：
#   MQTT: 1883
#   EMQX Dashboard: 18083
#
# Docker 内部：
#   Web → Center → InfluxDB
#   Center → EMQX
#
# 服务：
#   broker  MQTT Broker
#   influx  时序数据库
#   center  NitroCloud 中心服务
#   web     Vue + Nginx

name: nitrocloud

networks:
  nitrocloud-net:

services:

  # MQTT Broker
  broker:
    image: emqx:5.8.3
    container_name: nitrocloud-broker
    restart: unless-stopped
    networks:
      - nitrocloud-net

    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-admin123456}
      TZ: Asia/Shanghai

    ports:
      - "1883:1883"
      - "18083:18083"

    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 12


  # InfluxDB：保存时序数据
  influx:
    image: influxdb:2.7
    container_name: nitrocloud-influx
    restart: unless-stopped
    networks:
      - nitrocloud-net

    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-admin123456}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-nitrocloud}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-nitrocloud}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-dev-token}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUXDB_RETENTION:-30d}
      TZ: Asia/Shanghai

    volumes:
      - influx-data:/var/lib/influxdb2

    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12


  # NitroCloud Center
  center:
    build:
      context: .
      dockerfile: src/NitroCloud.Api/Dockerfile

    container_name: nitrocloud-center
    restart: unless-stopped
    networks:
      - nitrocloud-net

    depends_on:
      broker:
        condition: service_healthy
      influx:
        condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: Production

      # 元数据 SQLite
      Persistence__ConnectionString: "Data Source=/data/nitrocloud.db"

      # InfluxDB
      Influx__Url: "http://influx:8086"
      Influx__Token: ${INFLUXDB_TOKEN:-dev-token}
      Influx__Org: ${INFLUXDB_ORG:-nitrocloud}
      Influx__Bucket: ${INFLUXDB_BUCKET:-nitrocloud}

      # MQTT（上行采集 Ingest + 下行回写 Command 都连 EMQX broker；
      # 不覆盖则回落 appsettings.json 的 localhost —— 在容器内指向自身，连不上 broker）
      Ingest__MqttHost: broker
      Ingest__MqttPort: "1883"
      Command__MqttHost: broker
      Command__MqttPort: "1883"

      TZ: Asia/Shanghai

    volumes:
      - center-data:/data


  # Vue 前端 + Nginx
  web:
    build:
      context: ./web
      dockerfile: Dockerfile

    container_name: nitrocloud-web
    restart: unless-stopped
    networks:
      - nitrocloud-net

    depends_on:
      - center

    ports:
      - "${WEB_PORT:-8088}:80"


volumes:
  influx-data:
  center-data:
