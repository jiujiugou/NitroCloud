# NitroCloud 单机演示编排（DoD 6：一条命令拉起）
#
# 用法：
#   docker compose up -d                          # 仅基础服务（broker + InfluxDB）
#   docker compose --profile full up -d --build   # 全链路（含 center + web 容器）
#   docker compose down -v                        # 清理（含数据卷）
#
# 关键端口：1883 MQTT ｜ 18083 EMQX 控制台 ｜ 8086 InfluxDB ｜ 5100 center ｜ 8088 web
name: nitrocloud

services:
  # ── MQTT Broker（EMQX 5.x，DESIGN.md §3）──
  broker:
    image: emqx:5.8.3
    container_name: nitrocloud-broker
    restart: unless-stopped
    environment:
      EMQX_NODE__COOKIE: nitrocloud
      EMQX_DASHBOARD__DEFAULT_PASSWORD: admin123456
    ports:
      - "1883:1883"
      - "18083:18083"
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ── 时序库 InfluxDB 2.x（bucket: nitrocloud，自动初始化）──
  influx:
    image: influxdb:2.7
    container_name: nitrocloud-influx
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin123456
      DOCKER_INFLUXDB_INIT_ORG: nitrocloud
      DOCKER_INFLUXDB_INIT_BUCKET: nitrocloud
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: dev-token
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
    ports:
      - "8086:8086"
    volumes:
      - influx-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ── 中心平台（ASP.NET Core；DoD 6 全链路拉起时启用）──
  center:
    build:
      context: .
      dockerfile: src/NitroCloud.Api/Dockerfile
    container_name: nitrocloud-center
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      broker:
        condition: service_healthy
      influx:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Persistence__ConnectionString: "Data Source=/data/nitrocloud.db"
      Influx__Url: http://influx:8086
      Influx__Token: dev-token
      Influx__Org: nitrocloud
      Influx__Bucket: nitrocloud
      Ingest__MqttHost: broker
      Ingest__MqttPort: "1883"
      Command__MqttHost: broker
      Command__MqttPort: "1883"
    ports:
      - "5100:5100"
    volumes:
      - center-data:/data

  # ── 前端大屏/管理面板（Vite 构建产物 + nginx 反代 /api、/hubs）──
  web:
    build:
      context: web
      dockerfile: Dockerfile
    container_name: nitrocloud-web
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      center:
        condition: service_started
    ports:
      - "8088:80"

volumes:
  influx-data:
  center-data:
