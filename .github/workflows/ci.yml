# NitroCloud CI/CD（GitHub Actions + GHCR，见 notes/ADR/deploy/ADR-011）
#
# 触发：
#   - push master / v* tag / pull_request 都进同一入口
#   - PR 只跑 CI（build-server / build-web / validate-compose），不发布镜像
#   - push master / v* tag 且 CI 全绿时，额外 build-images 构建并推送 GHCR
#
# 镜像与 tag（ghcr.io/jiujiugou/nitrocloud-{center,web}）：
#   - master    → latest + sha-<7>
#   - vX.Y.Z    → vX.Y.Z + sha-<7>（tag 即版本，发布可追溯）
#
# 部署机（不再现场构建）：
#   docker compose -f docker-compose.yml -f docker-compose.cd.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.cd.yml up -d

name: CI/CD

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  # ── CI 1/3：后端 build + 全量单测 ──
  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore NitroCloud.slnx

      - name: Build
        run: dotnet build NitroCloud.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/NitroCloud.UnitTests/NitroCloud.UnitTests.csproj -c Release --no-build

  # ── CI 2/3：前端 vue-tsc 类型检查 + vite build ──
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  # ── CI 3/3：compose 形态校验（只校验不运行）──
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config -q
      - name: Validate cd overlay
        run: docker compose -f docker-compose.yml -f docker-compose.cd.yml config -q

  # ── CD：构建 + 推送 GHCR（仅 master push / v* tag，且 CI 三档全绿）──
  build-images:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build-server, build-web, validate-compose]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          SHA_SHORT="${GITHUB_SHA::7}"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="latest"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Build and push center
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/NitroCloud.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/jiujiugou/nitrocloud-center:${{ steps.meta.outputs.version }}
            ghcr.io/jiujiugou/nitrocloud-center:sha-${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: web/Dockerfile
          push: true
          tags: |
            ghcr.io/jiujiugou/nitrocloud-web:${{ steps.meta.outputs.version }}
            ghcr.io/jiujiugou/nitrocloud-web:sha-${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
