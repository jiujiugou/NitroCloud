# NitroCloud 前端 nginx 配置（容器内 80 端口）。
# 职责：
#   1) 托管 dist 静态资源 + vue-router history 模式回退 /index.html
#   2) 同源反代 REST /api/ 与 SignalR /hubs/ → center:5100（避免浏览器跨域，CORS 仅放行 dev 源）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 静态压缩（大屏 ECharts/Element Plus 体积大，压缩显著降带宽）
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # vue-router history 模式：非真实文件一律回退 index.html 交给前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（Vite 产物带内容 hash，可安全长缓存；index.html 不走此规则）
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # REST API 反代 → center:5100；不带 URI 尾的 proxy_pass 会原样透传 /api/... 前缀
    location /api/ {
        proxy_pass http://center:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # SignalR /hubs/ 反代 → center:5100；必须带 WebSocket Upgrade/Connection 头，读超时放宽到 1h
    location /hubs/ {
        proxy_pass http://center:5100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
